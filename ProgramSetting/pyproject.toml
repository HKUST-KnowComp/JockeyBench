[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jockeybench"
version = "1.0.0"
description = "JockeyBench: evaluating LLM agents that write and revise horse-racing forecasting programs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.4.2", "scipy==1.17.0", "scikit-learn==1.8.0"]

[project.optional-dependencies]
data = ["lhafile==0.3.1"]  # the importer; requirements-lock.txt includes it

[project.scripts]
jockeybench = "jockeybench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["native: runs real sandbox-exec jobs on macOS (synthetic, in-memory data only)"]

[tool.ruff]
line-length = 140
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "RUF100"]
# E501: agent-facing strings are kept verbatim; E731: small key lambdas are clearer inline.
ignore = ["E501", "E731"]
