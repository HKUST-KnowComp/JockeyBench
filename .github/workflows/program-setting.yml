name: ProgramSetting
on:
  push:
    paths: ['ProgramSetting/**', '.github/workflows/program-setting.yml']
  pull_request:
    paths: ['ProgramSetting/**', '.github/workflows/program-setting.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: ProgramSetting

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the hygiene check reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_repository.py --history

  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - name: Linux sandbox and importer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2 libarchive-tools lsof build-essential
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest
      # Ubuntu 24.04 may restrict unprivileged user namespaces through AppArmor.
      # Exercise native Linux isolation on 22.04 without weakening host security policy.
      - name: Sandbox jobs (fabricated data only)
        if: matrix.os != 'ubuntu-24.04'
        run: python -m pytest -m native
        env:
          JRDB_NATIVE: '1'
