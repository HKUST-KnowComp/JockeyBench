name: JockeyBench
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the hygiene check reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: ruff check src/jockeybench/research/public.py src/jockeybench/research/profile.py src/jockeybench/research/cli.py src/jockeybench/research/portable_warmup.py
      - run: ruff format --check src/jockeybench/research/public.py src/jockeybench/research/profile.py src/jockeybench/research/cli.py src/jockeybench/research/portable_warmup.py
      - run: python scripts/check_repository.py --history
      - run: python -B scripts/verify_research_provenance.py

  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
      - name: Linux sandbox and importer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2 libarchive-tools lsof build-essential
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: jockeybench program --help
      - run: jockeybench research --help
      - run: python -m pytest
      - name: One built distribution contains both settings
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python scripts/check_wheel.py dist/jockeybench-1.2.0-py3-none-any.whl
      # Ubuntu 24.04 may restrict unprivileged user namespaces through AppArmor.
      # Exercise native Linux isolation on 22.04 without weakening host security policy.
      - name: Sandbox jobs (fabricated data only)
        if: matrix.os != 'ubuntu-24.04'
        run: python -m pytest -m native
        env:
          JRDB_NATIVE: '1'
